<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#182532">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | absolute_url }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:title" content="{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:site_name" content="{{ site.title | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/fish.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/brand.css' | relative_url }}">
  <script defer src="{{ '/assets/js/fish.js' | relative_url }}"></script>
  <script defer src="{{ '/assets/js/blog.js' | relative_url }}"></script>
  {% if page.taxonomy %}<script defer src="{{ '/assets/js/taxonomy.js' | relative_url }}"></script>{% endif %}
  {% if page.layout == 'post' %}<script defer src="{{ '/assets/js/post.js' | relative_url }}"></script>{% endif %}
</head>
<body>
  <a class="skip-link" href="#main-content">跳转到正文</a>
  <header class="esteliel-header esteliel-header--section" data-site-header>
    <div class="esteliel-header__inner">
      <a class="esteliel-brand" href="{{ site.url }}/" aria-label="Esteliel 首页"><span class="esteliel-brand__mark" aria-hidden="true">e.</span><span>Esteliel</span><span class="esteliel-brand__section">BLOG</span></a>
      <nav class="esteliel-nav" aria-label="主导航">
        <a href="{{ site.url }}/nav/">导航</a>
        <a href="{{ '/' | relative_url }}" aria-current="page">博客</a>
        <a href="{{ site.url }}/tools/">工具</a>
        <a href="{{ site.url }}/prompts/" target="_blank" rel="noopener noreferrer" aria-label="提示词管理（在新标签页打开）">提示词</a>
        <a href="{{ site.url }}/gallery/">相册</a>
        <a href="{{ site.url }}/about/">关于</a>
      </nav>
    </div>
    <div class="esteliel-header__secondary">
    <nav class="esteliel-subnav" aria-label="博客导航">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' or page.layout == 'post' %} aria-current="page"{% endif %}>文章</a>
      <a href="{{ '/categories/' | relative_url }}"{% if page.taxonomy == 'category' %} aria-current="page"{% endif %}>分类</a>
      <a href="{{ '/tags/' | relative_url }}"{% if page.taxonomy == 'tag' %} aria-current="page"{% endif %}>标签</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </nav>
    </div>
  </header>
  <main id="main-content" tabindex="-1" class="site-content{% if page.home %} site-content--home{% endif %}">
    {{ content }}
    <footer class="site-footer"><span>ESTELIEL · 随写，随想。</span><a href="{{ '/feed.xml' | relative_url }}">保持连接 · RSS ↗</a></footer>
  </main>
  <div id="jsi-flying-fish-container" class="fish-container" aria-hidden="true"></div>
</body>
</html>
