<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#182532">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | absolute_url }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:title" content="{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:site_name" content="{{ site.title | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/fish.css' | relative_url }}">
  <script defer src="{{ '/assets/js/fish.js' | relative_url }}"></script>
  <script defer src="{{ '/assets/js/blog.js' | relative_url }}"></script>
  {% if page.taxonomy %}<script defer src="{{ '/assets/js/taxonomy.js' | relative_url }}"></script>{% endif %}
</head>
<body>
  <header class="site-header" data-site-header>
    <a class="site-brand" href="{{ '/' | relative_url }}">ESTELIEL / BLOG</a>
    <nav class="site-nav" aria-label="站点导航">
      <a href="{{ '/' | relative_url }}">文章</a>
      <a href="{{ '/categories/' | relative_url }}">分类</a>
      <a href="{{ '/tags/' | relative_url }}">标签</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </nav>
  </header>
  <main class="site-content{% if page.home %} site-content--home{% endif %}">
    {{ content }}
  </main>
  <div id="jsi-flying-fish-container" class="fish-container" aria-hidden="true"></div>
</body>
</html>
