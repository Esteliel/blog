<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/fish.css' | relative_url }}">
  <script defer src="{{ '/assets/js/fish.js' | relative_url }}"></script>
  <script defer src="{{ '/assets/js/blog.js' | relative_url }}"></script>
</head>
<body>
  <header class="site-header">
    <a class="site-brand" href="{{ '/' | relative_url }}">ESTELIEL / BLOG</a>
    <nav class="site-nav" aria-label="站点导航">
      <a href="{{ '/' | relative_url }}">文章</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </nav>
  </header>
  <main class="site-content{% if page.home %} site-content--home{% endif %}">
    {{ content }}
  </main>
  <div id="jsi-flying-fish-container" class="fish-container" aria-hidden="true"></div>
</body>
</html>
