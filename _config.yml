title: Esteliel Blog
description: 记录想法、学习与生活中的小发现。
url: "https://esteliel.github.io"
baseurl: "/blog"
lang: zh-CN
timezone: Asia/Shanghai
markdown: kramdown
highlighter: rouge
permalink: /posts/:year/:month/:day/:title/
excerpt_separator: "<!--more-->"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
